workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          # Если в проекте PWABuilder есть Podfile, раскомментируй строку ниже
          # cd ios && pod install
          echo "Dependencies are ready"
      - name: Build unsigned IPA
        script: |
          cd ios 
          
          xcodebuild archive \
            -project "*.xcodeproj" \
            -scheme "ВашеИмяСхемы" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
          mkdir -p build/Payload
          cp -r $CM_BUILD_DIR/build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r App-unsigned.ipa Payload
    artifacts:
      - build/App-unsigned.ipa
