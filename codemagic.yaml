workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd $CM_BUILD_DIR/src
          pod install
      - name: Build unsigned IPA
        script: |
          cd $CM_BUILD_DIR/src
          
          xcodebuild archive \
            -workspace "Fragmently.xcworkspace" \
            -scheme "Fragmently" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
          mkdir -p $CM_BUILD_DIR/build/Payload
          cp -r $CM_BUILD_DIR/build/App.xcarchive/Products/Applications/*.app $CM_BUILD_DIR/build/Payload/
          cd $CM_BUILD_DIR/build && zip -r App-unsigned.ipa Payload
    artifacts:
      - build/App-unsigned.ipa
